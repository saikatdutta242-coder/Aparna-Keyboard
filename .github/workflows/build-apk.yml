name: Build Aparna Android Keyboard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project zip if uploaded directly from phone
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE" -d .
              if [ -d "Aparna_Keyboard_Android_Project" ] && [ ! -f "settings.gradle.kts" ]; then
                cp -r Aparna_Keyboard_Android_Project/* .
                cp -r Aparna_Keyboard_Android_Project/.* . 2>/dev/null || true
              fi
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for easy download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Aparna-MultiLanguage-Keyboard-v1.0.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aparna-MultiLanguage-Keyboard-v1.0-APK
          path: Aparna-MultiLanguage-Keyboard-v1.0.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: "Aparna Multi-Language Keyboard v1.0 (APK)"
          body: "অপর্ণা মাল্টি-ল্যাঙ্গুয়েজ অ্যান্ড্রয়েড কিবোর্ড (English, বাংলা, বৈদিক-বাংলা, Devanagari) — সরাসরি নিচের APK ফাইলটিতে ট্যাপ করে ডাউনলোড ও ইনস্টল করুন।"
          files: Aparna-MultiLanguage-Keyboard-v1.0.apk
